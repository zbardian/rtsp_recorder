version: "3.9"

# Arhitectura:
#   Camera IP (flux RTSP) --> MediaMTX (proxy RTSP, ruleaza direct pe host, localhost:8554)
#                                  |
#                          rtsp_recorder (container)
#                                  |
#                     segmente video --> /mnt/storage1/rtsp_disk/YYYY-MM-DD/

services:
  rtsp_recorder:
    build: .
    container_name: rtsp_recorder
    restart: always
    network_mode: host
    volumes:
      - /mnt/storage1/rtsp_disk:/mnt/storage1/rtsp_disk
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Europe/Bucharest
      - RTSP_URL=rtsp://sd6csc3:12345678@localhost:8554/stream1
      - RTSP_USER=
      - RTSP_PASS=
      - OUTPUT_DIR=/mnt/storage1/rtsp_disk
      - SEGMENT_MINUTES=5
      - MAX_DISK_USAGE=90
      - FFMPEG_LOGLEVEL=info
      - RTSP_TIMEOUT_OPTION=
      - RTSP_TIMEOUT_US=
      - OUTPUT_EXT=mkv
