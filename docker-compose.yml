version: "3.9"

# Arhitectura:
#   Camera IP (flux RTSP) --> MediaMTX (proxy RTSP, ruleaza direct pe host, localhost:8554)
#                                  |
#                          rtsp_recorder (container)
#                                  |
#                     segmente video --> /mnt/storage1/rtsp_disk/YYYY-MM-DD/

services:
  rtsp_recorder:
    build: .
    container_name: rtsp_recorder
    restart: always
    network_mode: host
    volumes:
      - /mnt/storage1/rtsp_disk:/mnt/storage1/rtsp_disk
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Europe/Bucharest
      - RTSP_URL=rtsp://192.168.50.50:8554/stream1
      - RTSP_USER=sd6csc3
      - RTSP_PASS=12345678
      - OUTPUT_DIR=/mnt/storage1/rtsp_disk
      - SEGMENT_MINUTES=5
      - SEGMENT_SECONDS=0
      - MAX_DISK_USAGE=90
      - FFMPEG_LOGLEVEL=info
      - RTSP_TIMEOUT_OPTION=
      - RTSP_TIMEOUT_US=
      - OUTPUT_EXT=mp4
      - AUDIO_ENABLED=1
      - AUDIO_CODEC=aac
      - AUDIO_BITRATE=48k
      - AUDIO_FILTER=aresample=async=1:first_pts=0
